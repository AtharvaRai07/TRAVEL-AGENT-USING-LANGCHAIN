<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }} — Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz@9..144&family=Sora:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #eef1f6;
            --ink: #0f172a;
            --card: rgba(255, 255, 255, 0.92);
            --line: #dbe3ee;
            --accent: #0d9488;
            --accent-hover: #0f766e;
            --accent-2: #4f46e5;
            --muted: #64748b;
            --display: "Instrument Serif", "Fraunces", Georgia, serif;
            --body: "DM Sans", "Segoe UI", sans-serif;
        }

        body.dark-mode {
            --bg: #0b1220;
            --ink: #e5eef8;
            --card: rgba(15, 23, 42, 0.92);
            --line: #24314a;
            --accent: #2dd4bf;
            --accent-hover: #5eead4;
            --accent-2: #8b5cf6;
            --muted: #91a4bb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--body);
            color: var(--ink);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(1200px 520px at 8% -12%, rgba(13, 148, 136, 0.09) 0%, transparent 55%),
                radial-gradient(900px 480px at 92% 0%, rgba(79, 70, 229, 0.07) 0%, transparent 50%),
                linear-gradient(165deg, #f8fafc 0%, var(--bg) 45%, #e8eef5 100%);
        }

        .login-container {
            width: min(100%, 460px);
            padding: 34px;
            border-radius: 28px;
            background: var(--card);
            border: 1px solid rgba(219, 227, 238, 0.9);
            box-shadow: 0 24px 64px rgba(15, 23, 42, 0.12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .login-topbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .theme-toggle {
            width: auto;
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid rgba(219, 227, 238, 0.9);
            background: rgba(248, 250, 252, 0.92);
            color: var(--ink);
            font-weight: 700;
            font-size: 0.86rem;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .theme-toggle:hover {
            transform: translateY(-1px);
            border-color: rgba(13, 148, 136, 0.45);
            box-shadow: 0 14px 24px rgba(15, 23, 42, 0.12);
        }

        body.dark-mode .login-container {
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.34);
        }

        body.dark-mode .theme-toggle {
            background: #0f172a;
            border-color: #24314a;
            color: var(--ink);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-header h1 {
            margin: 0 0 10px;
            font-family: var(--display);
            font-size: clamp(2.4rem, 4vw, 3.3rem);
            line-height: 0.95;
            color: var(--ink);
            letter-spacing: -0.03em;
        }

        .login-header p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .tab-switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 24px;
            padding: 6px;
            border-radius: 18px;
            background: rgba(15, 23, 42, 0.04);
            border: 1px solid rgba(219, 227, 238, 0.8);
        }

        .tab-switch button {
            padding: 12px 14px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--muted);
            border-radius: 14px;
            transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }

        .tab-switch button.active {
            background: white;
            color: var(--accent);
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
        }

        body.dark-mode .tab-switch {
            background: rgba(15, 23, 42, 0.7);
            border-color: rgba(36, 49, 74, 0.95);
        }

        body.dark-mode .tab-switch button.active {
            background: #111c31;
            color: var(--accent);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
        }

        .auth-form {
            display: none;
            animation: slideIn 0.35s ease;
        }

        .auth-form.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.84rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #334155;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--line);
            border-radius: 14px;
            font-size: 0.98rem;
            font-family: var(--body);
            background: rgba(248, 250, 252, 0.9);
            color: var(--ink);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            background: white;
            border-color: rgba(13, 148, 136, 0.55);
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.12);
        }

        body.dark-mode .form-group label {
            color: #cbd5e1;
        }

        body.dark-mode .form-group input {
            background: #0f172a;
            color: var(--ink);
            border-color: #24314a;
        }

        body.dark-mode .form-group input:focus {
            background: #111c31;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        button[type="submit"] {
            flex: 1;
            padding: 13px 18px;
            background: linear-gradient(135deg, var(--accent) 0%, #14b8a6 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.98rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            font-family: var(--body);
            box-shadow: 0 12px 24px rgba(13, 148, 136, 0.22);
        }

        button[type="submit"]:hover {
            transform: translateY(-1px);
            filter: brightness(1.02);
            box-shadow: 0 16px 28px rgba(13, 148, 136, 0.28);
        }

        .signup-link {
            text-align: center;
            font-size: 0.9em;
            color: var(--muted);
            margin-top: 16px;
        }

        .signup-link button {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-weight: 700;
            text-decoration: underline;
            padding: 0;
        }

        .error {
            background: #fff1f2;
            border: 1px solid #fecdd3;
            color: #b91c1c;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 18px;
            font-size: 0.92rem;
            line-height: 1.5;
            display: none;
        }

        .error.show {
            display: block;
        }

        body.dark-mode .error {
            background: rgba(127, 29, 29, 0.22);
            border-color: rgba(248, 113, 113, 0.28);
            color: #fecaca;
        }

        .loading {
            opacity: 0.72;
            pointer-events: none;
        }

        @media (max-width: 520px) {
            body {
                padding: 16px;
            }

            .login-container {
                padding: 24px 18px;
                border-radius: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-topbar">
            <button id="theme-toggle-btn" type="button" class="theme-toggle">Dark mode</button>
        </div>
        <div class="login-header">
            <h1>{{ app_name }}</h1>
            <p>Plan journeys across India with clarity and ease.</p>
        </div>

        <div class="tab-switch">
            <button class="tab-btn active" data-tab="signin">Sign In</button>
            <button class="tab-btn" data-tab="signup">Sign Up</button>
        </div>


        <form id="signin-form" class="auth-form active">
            <div class="error" id="signin-error"></div>
            <div class="form-group">
                <label for="signin-email">Email Address</label>
                <input type="email" id="signin-email" name="email" required placeholder="your.email@example.com" />
            </div>
            <div class="form-actions">
                <button type="submit">Sign In</button>
            </div>
        </form>


        <form id="signup-form" class="auth-form">
            <div class="error" id="signup-error"></div>
            <div class="form-group">
                <label for="signup-email">Email Address</label>
                <input type="email" id="signup-email" name="email" required placeholder="your.email@example.com" />
            </div>
            <div class="form-group">
                <label for="signup-name">Full Name (Optional)</label>
                <input type="text" id="signup-name" name="name" placeholder="John Doe" />
            </div>
            <div class="form-actions">
                <button type="submit">Create Account</button>
            </div>
        </form>
    </div>

    <script>
        const themeKey = 'party-theme';

        function applyTheme(theme) {
            document.body.classList.toggle('dark-mode', theme === 'dark');
            const themeBtn = document.getElementById('theme-toggle-btn');
            if (themeBtn) {
                themeBtn.textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';
            }
            localStorage.setItem(themeKey, theme);
        }

        applyTheme(localStorage.getItem(themeKey) || 'light');

        document.getElementById('theme-toggle-btn').addEventListener('click', () => {
            const nextTheme = document.body.classList.contains('dark-mode') ? 'light' : 'dark';
            applyTheme(nextTheme);
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                e.target.classList.add('active');
                document.getElementById(`${e.target.dataset.tab}-form`).classList.add('active');
            });
        });

        document.getElementById('signin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signin-email').value;
            const errorDiv = document.getElementById('signin-error');
            const form = e.target;

            form.classList.add('loading');
            errorDiv.classList.remove('show');

            try {
                sessionStorage.setItem('userEmail', email);
                sessionStorage.setItem('isLoggedIn', 'true');

                window.location.href = '/dashboard';
            } catch (error) {
                errorDiv.textContent = 'Error: ' + error.message;
                errorDiv.classList.add('show');
            } finally {
                form.classList.remove('loading');
            }
        });

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const name = document.getElementById('signup-name').value;
            const errorDiv = document.getElementById('signup-error');
            const form = e.target;

            form.classList.add('loading');
            errorDiv.classList.remove('show');

            try {
                sessionStorage.setItem('userEmail', email);
                sessionStorage.setItem('userName', name || 'Traveler');
                sessionStorage.setItem('isLoggedIn', 'true');

                window.location.href = '/dashboard';
            } catch (error) {
                errorDiv.textContent = 'Error: ' + error.message;
                errorDiv.classList.add('show');
            } finally {
                form.classList.remove('loading');
            }
        });

        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = '/dashboard';
        }
    </script>
</body>

</html>
